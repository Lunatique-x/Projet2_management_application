openapi: 3.0.0
info:
  title: ConcessionaireAPI - Section Employés
  version: 1.0.0
servers:
  - url: http://localhost:3000

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jsonwebtoken


tags:
  - name: Employer
    description: Gestion des employés du concessionnaire

paths:
  /allEmploye:
    get:
      tags: [Employer]
      summary: Récupérer tous les employés
      description: Récupération de tous les employées
      responses:
        '200':
          description: Liste des employés récupérée avec succès
  
  /allEmploye/{id}:
    get:
      tags: [Employer]
      summary: Récupérer un employé par ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Détails de l'employé

  /post/employe:
    post:
      tags: [Employer]
      summary: Création compte employé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "Kerian"
                email:
                  type: string
                  example: "kerian@test.com"
                password:
                  type: string
                  example: "123456"
      responses:
        '201':
          description: Employé créé avec succès

  /put/employes/{id}:
    put:
      tags: [Employer]
      summary: Modification d'un employé
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "Mario Luigi"
                email:
                  type: string
                  example: "exemple@gmail.com"
      responses:
        '200':
          description: Employé mis à jour

  /delete/employe/{id}:
    delete:
      tags: [Employer]
      summary: Supprimer un employé
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employé supprimé
  # --- CLIENTS ---
  /allClient:
    get:
      tags:
        - Client
      summary: Toutes les clients
      description: Cette route permet de récupérer tous les clients.
      responses:
        '200':
          description: Succès

  /client/{id}/download-pdf:
    get:
      tags:
        - Client
      summary: Récupération du pdf d'un client
      Description: Cette permet de récupérer un document pdf associe a un client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Succès

  /post/client:
    post:
      tags:
        - Client
      description: Gestion des clients

      summary: Création Client
      description: Création d'un client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "Alex"
                email:
                  type: string
                  example: "alexclient@gmail.com"
                phone:
                  type: string
                  example: "514-123-4567"
      responses:
        '201':
          description: Client créé avec succès

  /put/clients/{id}:
    put:
      tags:
        - Client
      summary: Modification Clients
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "Lex Icon"
                email:
                  type: string
                  example: "exemple@gmail.com"
      responses:
        '200':
          description: Client modifié avec succès

  /allClient/{id}:
    get:
      tags:
        - Client
      summary: Les client selon id du clients
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Succès

  /delete/client/{id}:
    delete:
      tags:
        - Client
      summary: Supprimer un client
      description: Supprime un client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Client supprimé
  # --- FACTURES ---
  /post/payement:
    post:
      tags:
        - Facture
      summary: Création Facture
      description: Création d'un payement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: integer
                  example: 1
                voiture_id:
                  type: integer
                  example: 1
                employe_id:
                  type: integer
                  example: 1
                date_fin_garantie:
                  type: string
                  format: date
                  example: "2026-03-31"
                prix_vente:
                  type: number
                  example: 24500.00
      responses:
        '201':
          description: Facture créée avec succès

  /allFactures:
    get:
      tags:
        - Facture
      summary: Tout les facture
      description: Recuperation des factures
      responses:
        '200':
          description: Succès

  /client/{id}/factures:
    get:
      tags:
        - Facture
      summary: Facture selon id du client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Succès

  /allFactures/{id}:
    get:
      tags:
        - Facture
      summary: Une facture selon id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Succès

  /put/payements/{id}:
    put:
      tags:
        - Facture
      summary: Modifications Facture
      description: Met à jour une facture de paiement. Gère l'historique et ajuste automatiquement les stocks de voitures si le véhicule change.
      parameters:
        - name: id
          in: path
          required: true
          description: L'identifiant unique du paiement à modifier
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - employe_id
                - voiture_id
                - prix_vente
              properties:
                client_id:
                  type: integer
                  description: ID du client associé
                  example: 6
                employe_id:
                  type: integer
                  description: ID de l'employé qui réalise la vente
                  example: 2
                voiture_id:
                  type: integer
                  description: ID du nouveau véhicule choisi
                  example: 4
                prix_vente:
                  type: number
                  format: float
                  description: Le montant de la transaction
                  example: 30000
      responses:
        '200':
          description: Facture modifiée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_payement:
                    type: integer
                  client_id:
                    type: integer
                  employe_id:
                    type: integer
                  voiture_id:
                    type: integer
                  prix_vente:
                    type: number
        '400':
          description: Rupture de stock pour la nouvelle voiture
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "La nouvelle voiture sélectionnée est en rupture de stock."
        '404':
          description: Paiement introuvable en base de données
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Paiement introuvable"
        '500':
          description: Erreur interne du serveur

  /delete/payement/{id}:
    delete:
      tags:
        - Facture
      summary: Supprimer une facture
      description: suprimer une facture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Facture supprimée
  # --- VOITURE ---
  /post/voiture:
    post:
      tags:
        - Voiture
      summary: Création voiture
      description: Création d'une voiture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modele:
                  type: string
                  example: "Tesla Model 3"
                stock:
                  type: integer
                  example: 12
                couleur:
                  type: string
                  example: "Bleu"
                prix:
                  type: number
                  example: 42990.50
      responses:
        '201':
          description: Voiture créée avec succès

  /allVoiture:
    get:
      tags:
        - Voiture
      summary: Tous les voiture
      description: Cette route permet de recuperer tout les voitures
      responses:
        '200':
          description: Succès

  /allVoiture/{id}:
    get:
      tags:
        - Voiture
      summary: Une voiturse selon id
      description: Cette route permet de recuperer une voiture specifique selon id de la voiture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Succès

  /put/voitures/{id}:
    put:
      tags:
        - Voiture
      summary: Modifications Voitures
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modele:
                  type: string
                  example: "Toyota"
                couleur:
                  type: string
                  example: "vert"
      responses:
        '200':
          description: Voiture modifiée avec succès

  /delete/voiture/{id}:
    delete:
      tags:
        - Voiture
      summary: Supprimer une voiture
      description: Supprimer une facuture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Voiture supprimée
  # --- ROLE ---
  /post/role:
    post:
      tags:
        - Role
      summary: Création d'un rôle
      description: Crée un nouveau rôle utilisateur avec des permissions d'accès spécifiques pour les stocks, les clients et les ventes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nom
              properties:
                nom:
                  type: string
                  description: Le nom unique du rôle
                  example: "Vendeur Junior"
                viewStock:
                  type: boolean
                  default: false
                  example: true
                modStock:
                  type: boolean
                  default: false
                  example: false
                viewClients:
                  type: boolean
                  default: false
                  example: true
                delClients:
                  type: boolean
                  default: false
                  example: false
                modClients:
                  type: boolean
                  default: false
                  example: false
                viewSell:
                  type: boolean
                  default: false
                  example: true
                delSell:
                  type: boolean
                  default: false
                  example: false
                modSell:
                  type: boolean
                  default: false
                  example: true
                addSell:
                  type: boolean
                  default: false
                  example: true
                addClient:
                  type: boolean
                  default: false
                  example: true
                addStock:
                  type: boolean
                  default: false
                  example: false
                delStock:
                  type: boolean
                  default: false
                  example: false
      responses:
        '201':
          description: Rôle créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_role:
                    type: integer
                    example: 1
                  nom:
                    type: string
                    example: "Vendeur Junior"
        '400':
          description: Requête invalide (par exemple, le nom du rôle est manquant)
        '500':
          description: Erreur interne du serveur

  /allRole:
    get:
      tags:
        - Role
      summary: Tous les role
      description: Cette route permet de recuperer tous les rôles
      responses:
        '200':
          description: Succès

  /allRole/{id}:
    get:
      tags:
        - Role
      summary: Un role selon id
      description: Cette route permet de recuperer un role specifique selon id du role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Succès

  /put/roles/{id}:
    put:
      tags:
        - Role
      summary: Modification d'un rôle
      description: Permet de modifier partiellement ou totalement les informations et les permissions d'un rôle existant via son identifiant unique.
      parameters:
        - name: id
          in: path
          required: true
          description: L'identifiant unique du rôle à modifier
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                  description: Le nouveau nom du rôle
                  example: "Vendeur Senior"
                viewStock:
                  type: boolean
                  description: Autoriser la visualisation du stock
                  example: true
                modStock:
                  type: boolean
                  description: Autoriser la modification du stock
                  example: true
                viewClients:
                  type: boolean
                  description: Autoriser la visualisation des clients
                  example: true
                delClients:
                  type: boolean
                  description: Autoriser la suppression des clients
                  example: false
                modClients:
                  type: boolean
                  description: Autoriser la modification des clients
                  example: true
                viewSell:
                  type: boolean
                  description: Autoriser la visualisation des ventes
                  example: true
                delSell:
                  type: boolean
                  description: Autoriser la suppression des ventes
                  example: false
                modSell:
                  type: boolean
                  description: Autoriser la modification des ventes
                  example: true
                addSell:
                  type: boolean
                  description: Autoriser l'ajout de ventes
                  example: true
                addClient:
                  type: boolean
                  description: Autoriser l'ajout de clients
                  example: true
                addStock:
                  type: boolean
                  description: Autoriser l'ajout de produits au stock
                  example: true
                delStock:
                  type: boolean
                  description: Autoriser la suppression d'éléments du stock
                  example: false
      responses:
        '200':
          description: Rôle modifié avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_role:
                    type: integer
                    example: 1
                  nom:
                    type: string
                    example: "Vendeur Senior"
        '400':
          description: Données fournies invalides ou mal formées
        '404':
          description: Rôle introuvable avec l'identifiant fourni
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Rôle introuvable"
        '500':
          description: Erreur interne du serveur

  /delete/role/{id}:
    delete:
      tags:
        - Role
      summary: Supprimer un role
      description: Suprime un role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Rôle supprimé
  # --- TOKEN ---
  /auth/token:
    post:
      tags:
        - Token
      summary: Création Token
      description: Permet de créer un token d'authentification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "admin@gmail.com"
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Token généré avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: string
              # Voici l'exemple qui s'affichera dans Swagger
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Identifiants invalides
